<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>HashRise Firebase</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #080b12, #151b2e); color: white; }
    .app { max-width: 1200px; margin: auto; padding: 24px; }
    h1 { margin-bottom: 4px; }
    .sub { color: #94a3b8; margin-top: 0; }

    /* ステータスカード */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
    .card { background: rgba(30,41,59,0.9); border: 1px solid rgba(148,163,184,.18); border-radius: 18px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,.25); }
    .label { color: #94a3b8; font-size: 13px; }
    .value { font-size: 22px; font-weight: 800; margin-top: 6px; }
    .small { font-size: 14px; word-break: break-all; }

    /* 採掘停止中ハイライト */
    .mining-stopped { background: rgba(80,10,10,0.92) !important; border-color: rgba(239,68,68,.55) !important; }
    .mining-stopped .label { color: #fca5a5; }
    .mining-stopped .value { color: #f87171; }

    /* チャート・ランキング */
    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }
    canvas { width: 100%; height: 330px; background: #020617; border-radius: 16px; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { padding: 8px; border-bottom: 1px solid rgba(148,163,184,.18); text-align: left; }
    th { color: #94a3b8; font-weight: 600; }

    /* 取引パネル */
    .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .trade-box h3 { margin: 0 0 14px; font-size: 15px; }
    .trade-box h3 .price-tag { font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 6px; }
    .field-label { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .tx-input {
      flex: 1; background: #0f172a; border: 1px solid rgba(148,163,184,.28);
      border-radius: 10px; padding: 9px 12px; color: white; font-size: 14px; outline: none; width: 0;
    }
    .tx-input:focus { border-color: #3b82f6; }
    .pct-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .pct-btn {
      flex: 1; border: 1px solid rgba(100,150,255,.3); border-radius: 8px; padding: 5px 0;
      background: rgba(59,130,246,.12); color: #93c5fd; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .pct-btn:hover { background: rgba(59,130,246,.28); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .divider { border: none; border-top: 1px solid rgba(148,163,184,.15); margin: 14px 0; }

    /* ボタン */
    .btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 13px; color: white; }
    .btn:hover { filter: brightness(1.18); }
    .btn-buy      { background: #2563eb; }
    .btn-sell     { background: #7c3aed; }
    .btn-sell-all { background: #9d174d; }
    .btn-upgrade  { background: #16a34a; }
    .btn-chart    { background: #1e3a5f; padding: 8px 14px; margin: 6px 4px 0; border-radius: 10px; }

    /* 採掘・強化 */
    .mine-card .btn-row { margin-top: 10px; }

    /* 取引ログ */
    .log-card strong { display: block; margin-bottom: 10px; }
    .log-list { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; }
    .log-list li { font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(148,163,184,.1); font-family: monospace; color: #cbd5e1; }
    .log-list li:last-child { border-bottom: 0; }
    .log-buy  { color: #60a5fa !important; }
    .log-sell { color: #c084fc !important; }
    .log-mine { color: #34d399 !important; }
    .log-err  { color: #f87171 !important; }
    .log-empty { color: #475569; font-size: 13px; font-family: monospace; padding: 6px 0; }

    /* ステータスバー */
    .status-bar { padding: 11px 16px; background: #020617; border-radius: 14px; color: #cbd5e1; margin-top: 14px; font-size: 13px; }

    @media(max-width:860px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .layout, .trade-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>HashRise</h1>
  <p class="sub">仮想通貨マイニング &amp; トレード</p>

  <!-- ステータスカード -->
  <div class="grid">
    <div class="card"><div class="label">市場更新</div><div class="value small"><span id="marketTime">未更新</span></div></div>
    <div class="card"><div class="label">総資産</div><div class="value">$<span id="totalValue">-</span></div></div>
    <div class="card"><div class="label">BTC価格</div><div class="value">$<span id="btcPrice">-</span></div></div>
    <div class="card"><div class="label">LUMA価格</div><div class="value">$<span id="lumaPrice">-</span></div></div>
    <div class="card"><div class="label">USD</div><div class="value">$<span id="usd">-</span></div></div>
    <div class="card"><div class="label">BTC</div><div class="value small"><span id="btc">-</span></div></div>
    <div class="card"><div class="label">LUMA</div><div class="value"><span id="luma">-</span></div></div>
    <div class="card" id="miningStatusCard">
      <div class="label">採掘状態</div>
      <div class="value small" id="miningStatus">-</div>
    </div>
    <div class="card"><div class="label">採掘力</div><div class="value"><span id="th">-</span> TH/s</div></div>
    <div class="card"><div class="label">効率</div><div class="value">x<span id="miningBoost">-</span></div></div>
    <div class="card"><div class="label">最新採掘</div><div class="value small"><span id="lastMined">-</span> BTC</div></div>
    <div class="card"><div class="label">最新ニュース</div><div class="value small" id="lastEvent">-</div></div>
    <div class="card"><div class="label">維持費 / 分</div><div class="value small">$<span id="maintenanceCost">-</span></div></div>
    <div class="card"><div class="label">次のTH価格</div><div class="value small">$<span id="nextThPrice">-</span></div></div>
    <div class="card"><div class="label">維持費 残り回数</div><div class="value small"><span id="maintRounds">-</span> 回分</div></div>
  </div>

  <!-- チャート + ランキング -->
  <div class="layout">
    <div class="card">
      <canvas id="chart" width="780" height="330"></canvas>
      <div>
        <button class="btn btn-chart" onclick="setChart('BTC')">BTCチャート</button>
        <button class="btn btn-chart" onclick="setChart('LUMA')">LUMAチャート</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 12px">ランキング</h2>
      <table>
        <thead><tr><th>#</th><th>名前</th><th>総資産</th></tr></thead>
        <tbody id="rankingBody"><tr><td colspan="3">読み込み中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 取引パネル -->
  <div class="trade-grid">

    <!-- BTC -->
    <div class="card trade-box">
      <h3>BTC 取引 <span class="price-tag" id="btcPriceTag"></span></h3>

      <div class="field-label">購入額（USD）</div>
      <div class="input-row">
        <input class="tx-input" id="btcBuyInput" type="number" min="0" step="any" placeholder="例: 100">
      </div>
      <div class="pct-row">
        <button class="pct-btn" onclick="setPct('btcBuyInput','usd',25)">25%</button>
        <button class="pct-btn" onclick="setPct('btcBuyInput','usd',50)">50%</button>
        <button class="pct-btn" onclick="setPct('btcBuyInput','usd',100)">100%</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-buy" onclick="buyBTC()">BTC購入</button>
      </div>

      <hr class="divider">

      <div class="field-label">売却数量（BTC）</div>
      <div class="input-row">
        <input class="tx-input" id="btcSellInput" type="number" min="0" step="any" placeholder="例: 0.001">
      </div>
      <div class="pct-row">
        <button class="pct-btn" onclick="setPct('btcSellInput','btc',25)">25%</button>
        <button class="pct-btn" onclick="setPct('btcSellInput','btc',50)">50%</button>
        <button class="pct-btn" onclick="setPct('btcSellInput','btc',100)">100%</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-sell"     onclick="sellBTC()">BTC売却</button>
        <button class="btn btn-sell-all" onclick="sellBTCAll()">全額売却</button>
      </div>
    </div>

    <!-- LUMA -->
    <div class="card trade-box">
      <h3>LUMA 取引 <span class="price-tag" id="lumaPriceTag"></span></h3>

      <div class="field-label">購入額（USD）</div>
      <div class="input-row">
        <input class="tx-input" id="lumaBuyInput" type="number" min="0" step="any" placeholder="例: 50">
      </div>
      <div class="pct-row">
        <button class="pct-btn" onclick="setPct('lumaBuyInput','usd',25)">25%</button>
        <button class="pct-btn" onclick="setPct('lumaBuyInput','usd',50)">50%</button>
        <button class="pct-btn" onclick="setPct('lumaBuyInput','usd',100)">100%</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-buy" onclick="buyLUMA()">LUMA購入</button>
      </div>

      <hr class="divider">

      <div class="field-label">売却数量（LUMA）</div>
      <div class="input-row">
        <input class="tx-input" id="lumaSellInput" type="number" min="0" step="any" placeholder="例: 100">
      </div>
      <div class="pct-row">
        <button class="pct-btn" onclick="setPct('lumaSellInput','luma',25)">25%</button>
        <button class="pct-btn" onclick="setPct('lumaSellInput','luma',50)">50%</button>
        <button class="pct-btn" onclick="setPct('lumaSellInput','luma',100)">100%</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-sell"     onclick="sellLUMA()">LUMA売却</button>
        <button class="btn btn-sell-all" onclick="sellLUMAAll()">全額売却</button>
      </div>
    </div>
  </div>

  <!-- 採掘・強化 -->
  <div class="card mine-card">
    <strong>採掘 &amp; 強化</strong>
    <div class="btn-row">
      <button class="btn btn-upgrade" onclick="buyTH()">採掘力 +1TH</button>
      <button class="btn btn-upgrade" onclick="upgradeBoost()">LUMAで効率強化（50 LUMA）</button>
    </div>
  </div>

  <!-- 取引ログ -->
  <div class="card" style="margin-top:14px">
    <strong>取引ログ（直近30件）</strong>
    <ul class="log-list" id="txLog">
      <li class="log-empty">まだ取引履歴がありません</li>
    </ul>
  </div>

  <div class="status-bar" id="statusBar">接続準備中...</div>
</div>

<script type="module">
  import { initializeApp }     from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCYiKr4fC_BLFotJluoRB_ScoVja7odLPQ",
    authDomain: "kasoutuuka-4e7f4.firebaseapp.com",
    projectId: "kasoutuuka-4e7f4",
    storageBucket: "kasoutuuka-4e7f4.firebasestorage.app",
    messagingSenderId: "830301584329",
    appId: "1:830301584329:web:12f2917f191eb0d44f4618",
    measurementId: "G-ZX0BG0BL7N"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let uid = null, userData = null, gameData = null, rankingData = null;
  let chartAsset = "BTC";

  // ─── ユーティリティ ───────────────────────────────────────────
  const statusEl = document.getElementById("statusBar");
  function setStatus(text) { statusEl.textContent = text; }
  function money(n, d = 2) { return Number(n ?? 0).toLocaleString(undefined, { maximumFractionDigits: d }); }
  function formatTime(val) {
    if (!val) return "未更新";
    const d = new Date(val);
    return isNaN(d) ? "未更新" : d.toLocaleString("ja-JP", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
  }
  function getTotalValue() {
    if (!userData || !gameData) return 0;
    return Number(userData.usd ?? 0)
         + Number(userData.btc  ?? 0) * Number(gameData.btcPrice  ?? 0)
         + Number(userData.luma ?? 0) * Number(gameData.lumaPrice ?? 0);
  }

  // ─── 取引ログ ─────────────────────────────────────────────────
  const txLogs = [];
  function addLog(cls, msg) {
    const t = new Date().toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
    txLogs.unshift({ cls, msg, t });
    if (txLogs.length > 30) txLogs.pop();
    const ul = document.getElementById("txLog");
    ul.innerHTML = txLogs.map(l =>
      `<li class="log-${l.cls}">[${l.t}] ${l.msg}</li>`
    ).join("") || '<li class="log-empty">まだ取引履歴がありません</li>';
  }

  // ─── UI 更新 ──────────────────────────────────────────────────
  function updateGameUI() {
    if (!gameData) return;
    document.getElementById("marketTime").textContent = formatTime(gameData.lastTickAt);
    document.getElementById("btcPrice").textContent   = money(gameData.btcPrice);
    document.getElementById("lumaPrice").textContent  = Number(gameData.lumaPrice ?? 0).toFixed(4);
    document.getElementById("btcPriceTag").textContent  = `$${money(gameData.btcPrice)}`;
    document.getElementById("lumaPriceTag").textContent = `$${Number(gameData.lumaPrice ?? 0).toFixed(4)}`;

    // lastEvent はオブジェクト or 文字列
    const ev = gameData.lastEvent;
    document.getElementById("lastEvent").textContent =
      ev && typeof ev === "object" ? (ev.headline ?? "通常相場。") : (ev ?? "通常相場。");

    updateUserUI();
    drawChart();
  }

  function updateUserUI() {
    if (!userData) return;
    const usd     = Number(userData.usd   ?? 0);
    const btc     = Number(userData.btc   ?? 0);
    const luma    = Number(userData.luma  ?? 0);
    const th      = Number(userData.th    ?? 1);
    const boost   = Number(userData.miningBoost ?? 1);
    const mining  = userData.miningActive !== false;

    document.getElementById("usd").textContent         = usd.toFixed(2);
    document.getElementById("btc").textContent         = btc.toFixed(8);
    document.getElementById("luma").textContent        = luma.toFixed(2);
    document.getElementById("th").textContent          = th.toFixed(2);
    document.getElementById("miningBoost").textContent = boost.toFixed(2);
    document.getElementById("lastMined").textContent   = Number(userData.lastMinedBTC ?? 0).toFixed(8);
    document.getElementById("totalValue").textContent  = money(getTotalValue());

    // 採掘状態カード（停止中=赤ハイライト）
    const card = document.getElementById("miningStatusCard");
    const txt  = document.getElementById("miningStatus");
    if (!mining) {
      card.classList.add("mining-stopped");
      txt.textContent = "⚠️ 停止中 / 維持費不足";
    } else {
      card.classList.remove("mining-stopped");
      txt.textContent = "✅ 稼働中";
    }

    // 維持費 / 分 = th × $0.015
    const maint = th * 0.015;
    document.getElementById("maintenanceCost").textContent = maint.toFixed(4);

    // 次のTH価格
    const nextTh = Number(userData.thPrice ?? 14);
    document.getElementById("nextThPrice").textContent = nextTh.toFixed(2);

    // 維持費 残り回数 = floor(usd / maint)
    document.getElementById("maintRounds").textContent =
      maint > 0 ? Math.floor(usd / maint).toLocaleString() : "∞";
  }

  function updateRankingUI() {
    const body    = document.getElementById("rankingBody");
    const players = rankingData?.players ?? [];
    if (!players.length) {
      body.innerHTML = '<tr><td colspan="3">まだランキングなし</td></tr>';
      return;
    }
    body.innerHTML = players.map((p, i) =>
      `<tr><td>${i+1}</td><td>${p.name}</td><td>$${money(p.totalValue)}</td></tr>`
    ).join("");
  }

  // ─── Firebase ─────────────────────────────────────────────────
  async function createUserIfNeeded(user) {
    uid = user.uid;
    const userRef = doc(db, "users", uid);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
      await setDoc(userRef, { usd:100, btc:0, luma:0, th:1, thPrice:14, miningBoost:1, miningActive:true, createdAt:Date.now() });
      setStatus("新規ユーザーを作成しました。");
    } else {
      setStatus("既存ユーザーでログインしました。");
    }
    onSnapshot(userRef, snap => { userData = snap.data(); updateUserUI(); });
  }

  function listenGameState() {
    onSnapshot(doc(db, "game", "state"), snap => {
      if (!snap.exists()) return setStatus("game/state が存在しません。");
      gameData = snap.data();
      updateGameUI();
      setStatus("Firestoreとリアルタイム同期中。");
    });
    onSnapshot(doc(db, "game", "ranking"), snap => {
      rankingData = snap.exists() ? snap.data() : { players: [] };
      updateRankingUI();
    });
  }

  async function start() {
    setStatus("匿名ログイン中...");
    await signInAnonymously(auth);
    onAuthStateChanged(auth, async user => {
      if (user) { await createUserIfNeeded(user); listenGameState(); }
    });
  }

  async function updateUser(fields) { await updateDoc(doc(db, "users", uid), fields); }

  // ─── 25/50/100% ボタン ────────────────────────────────────────
  window.setPct = function(inputId, balKey, pct) {
    if (!userData) return;
    const bal = Number(userData[balKey] ?? 0);
    const val = bal * pct / 100;
    document.getElementById(inputId).value =
      balKey === "btc" ? val.toFixed(8) : val.toFixed(2);
  };

  // ─── 取引ロジック ─────────────────────────────────────────────
  async function tradeBuy(inputId, key, label, price) {
    if (!uid || !userData || !gameData) return;
    const amount = Number(document.getElementById(inputId).value);
    if (!amount || amount <= 0) { setStatus("購入額を入力してください。"); return; }
    if (Number(userData.usd) < amount) { setStatus("USDが足りません。"); return; }
    const got = (amount * 0.995) / price;
    await updateUser({ usd: Number(userData.usd) - amount, [key]: Number(userData[key] ?? 0) + got });
    document.getElementById(inputId).value = "";
    const msg = `BUY ${label}: $${amount.toFixed(2)} → ${got.toFixed(key==="btc"?8:2)} ${label}`;
    setStatus(msg); addLog("buy", msg);
  }

  async function tradeSell(inputId, key, label, price, digits) {
    if (!uid || !userData || !gameData) return;
    const amount = Number(document.getElementById(inputId).value);
    if (!amount || amount <= 0) { setStatus("売却数量を入力してください。"); return; }
    if (Number(userData[key] ?? 0) < amount) { setStatus(`${label}が足りません。`); return; }
    const gain = amount * price * 0.995;
    await updateUser({ usd: Number(userData.usd) + gain, [key]: Number(userData[key]) - amount });
    document.getElementById(inputId).value = "";
    const msg = `SELL ${label}: ${amount.toFixed(digits)} → $${gain.toFixed(2)} (手数料0.5%)`;
    setStatus(msg); addLog("sell", msg);
  }

  async function tradeSellAll(key, label, price, digits) {
    if (!uid || !userData || !gameData) return;
    const amount = Number(userData[key] ?? 0);
    if (amount <= 0) { setStatus(`売却できる${label}がありません。`); return; }
    const gain = amount * price * 0.995;
    await updateUser({ usd: Number(userData.usd) + gain, [key]: 0 });
    const msg = `SELL ALL ${label}: ${amount.toFixed(digits)} → $${gain.toFixed(2)} (手数料0.5%)`;
    setStatus(msg); addLog("sell", msg);
  }

  window.buyBTC      = () => tradeBuy("btcBuyInput",   "btc",  "BTC",  gameData.btcPrice);
  window.sellBTC     = () => tradeSell("btcSellInput", "btc",  "BTC",  gameData.btcPrice, 8);
  window.sellBTCAll  = () => tradeSellAll("btc",  "BTC",  gameData.btcPrice, 8);
  window.buyLUMA     = () => tradeBuy("lumaBuyInput",  "luma", "LUMA", gameData.lumaPrice);
  window.sellLUMA    = () => tradeSell("lumaSellInput","luma", "LUMA", gameData.lumaPrice, 2);
  window.sellLUMAAll = () => tradeSellAll("luma", "LUMA", gameData.lumaPrice, 2);

  window.buyTH = async function () {
    const price = Number(userData?.thPrice ?? 14);
    if (Number(userData.usd) < price) { setStatus(`採掘力購入には $${price.toFixed(2)} 必要です。`); return; }
    await updateUser({ usd: Number(userData.usd)-price, th: Number(userData.th??1)+1, thPrice: price*1.08, miningActive:true });
    const msg = `UPGRADE TH: $${price.toFixed(2)} 消費 → +1 TH`;
    setStatus(msg); addLog("mine", msg);
  };

  window.upgradeBoost = async function () {
    if (Number(userData.luma ?? 0) < 50) { setStatus("効率強化には50 LUMA必要です。"); return; }
    const nb = Number(userData.miningBoost ?? 1) * 1.15;
    await updateUser({ luma: Number(userData.luma)-50, miningBoost: nb });
    const msg = `BOOST: -50 LUMA → 効率 x${nb.toFixed(2)}`;
    setStatus(msg); addLog("mine", msg);
  };

  // ─── チャート ─────────────────────────────────────────────────
  window.setChart = function(asset) { chartAsset = asset; drawChart(); };

  function drawChart() {
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const candles = chartAsset === "BTC"
      ? (gameData?.btcCandles ?? [])
      : (gameData?.lumaCandles ?? []);
    ctx.fillStyle = "#fff";
    ctx.font = "18px system-ui";
    ctx.fillText(`${chartAsset}/USD ローソク足`, 22, 28);
    if (!candles.length) {
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("相場更新後にチャートが表示されます", 22, 60);
      return;
    }
    const prices = candles.flatMap(c => [c.high, c.low]);
    const max = Math.max(...prices), min = Math.min(...prices);
    const pad = 42, w = canvas.width - pad*2, h = canvas.height - pad*2;
    const step = w / candles.length;
    ctx.strokeStyle = "#1e293b";
    for (let i = 0; i < 5; i++) {
      const y = pad + h/4 * i;
      ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(canvas.width-pad, y); ctx.stroke();
    }
    candles.forEach((c, i) => {
      const x  = pad + i * step + step / 2;
      const yH = mapY(c.high,  min, max, canvas.height, pad);
      const yL = mapY(c.low,   min, max, canvas.height, pad);
      const yO = mapY(c.open,  min, max, canvas.height, pad);
      const yC = mapY(c.close, min, max, canvas.height, pad);
      const up = c.close >= c.open;
      ctx.strokeStyle = up ? "#22c55e" : "#ef4444";
      ctx.fillStyle   = ctx.strokeStyle;
      ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
      ctx.fillRect(x - step*.25, Math.min(yO, yC), step*.5, Math.max(3, Math.abs(yC - yO)));
    });
    const fix = chartAsset === "BTC" ? 0 : 3;
    ctx.fillStyle = "#94a3b8"; ctx.font = "12px system-ui";
    ctx.fillText(`High $${max.toFixed(fix)}`, 22, canvas.height - 14);
    ctx.fillText(`Low  $${min.toFixed(fix)}`, 130, canvas.height - 14);
  }

  function mapY(p, min, max, height, pad) {
    if (max === min) return height / 2;
    return height - pad - ((p - min) / (max - min)) * (height - pad * 2);
  }

  start();
</script>
</body>
</html>
